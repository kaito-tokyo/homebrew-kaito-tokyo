name: brew pr-pull

on:
  pull_request_target:
    types:
      - labeled

jobs:
  pr-pull:
    if: contains(github.event.pull_request.labels.*.name, 'pr-pull')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@841d750a0ed9262d3c3ca31f2173974696bc261a # main
        with:
          token: ${{ github.token }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@18fcb8e3e06b4247c676c506750dc95ea7226479 # main
        with:
          username: github-actions[bot]

      - name: Fast-forward main
        working-directory: /home/linuxbrew/.linuxbrew/Homebrew/Library/Taps/${{ github.repository }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --prune --unshallow origin || git fetch --all
          git checkout main
          git reset --hard origin/main
          git fetch origin "$PR_HEAD_SHA"
          git merge --ff-only FETCH_HEAD

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: brew pr-pull --clean --debug --no-cherry-pick --tap="${GITHUB_REPOSITORY}" "${PULL_REQUEST}"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@841d750a0ed9262d3c3ca31f2173974696bc261a # main
        with:
          branch: main

      - name: Delete branch
        if: github.event.pull_request.head.repo.fork == false
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push --delete origin "${BRANCH}"
